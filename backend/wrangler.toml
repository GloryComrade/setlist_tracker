# Setlist Tracker: one Worker serves the website (the Flutter web build) and
# the API under /api/*. The contract is docs/cloudflare-api.md.
#
# Secrets are not kept here. Set them with `wrangler secret put NAME`:
#   SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY,
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET,
#   REPORT_WEBHOOK_URL (optional, docs/crew-reports.md)
# For `wrangler dev`, put them in backend/.dev.vars instead.

name = "setlist-tracker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../build/web"
binding = "ASSETS"
# Every request runs the Worker first so plain-http page visits can be sent
# to https too (with ["/api/*"] the pages were served straight over http).
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "setlist-tracker"
# The deploy workflow swaps this for the D1_DATABASE_ID repository variable.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APPLE_BUNDLE_ID = "com.glorycomrade.setlisttracker"
APPLE_SERVICES_ID = "com.glorycomrade.setlisttracker.web"
NATIVE_REDIRECT = "com.glorycomrade.setlisttracker://login-callback"

[observability]
enabled = true
