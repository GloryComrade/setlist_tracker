# Publishes a local-only copy of the web app to GitHub Pages on every push to
# main, until the Cloudflare deploy is set up (deploy.yml). Once the
# D1_DATABASE_ID repository variable exists this workflow skips itself, and
# Pages can be turned off under Settings → Pages.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.D1_DATABASE_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      # The site lives at https://<user>.github.io/<repo>/, so the app's base path is /<repo>/.
      # No backend here: the Pages copy is local-only (no sign-in or Crew).
      - run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
