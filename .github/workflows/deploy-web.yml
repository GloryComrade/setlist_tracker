# Publishes the web app to GitHub Pages on every push to main, so there is
# always a link to try the latest version on a laptop or phone.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      # The site lives at https://<user>.github.io/<repo>/, so the app's base path is /<repo>/.
      # Backstage Pass settings come from repository variables (Settings >
      # Secrets and variables > Actions > Variables). Left unset, the site is
      # local-only. See docs/backstage-pass-setup.md.
      - run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ vars.SUPABASE_KEY }}
          --dart-define=APPLE_SIGN_IN=${{ vars.APPLE_SIGN_IN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
