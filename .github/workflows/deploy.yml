# Publishes the app to Cloudflare on every push to main: one Worker serves the
# website and runs the backend (sign-in, syncing, The Crew, song search), with
# its data in a D1 database. See docs/cloudflare-setup.md.
#
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: D1_DATABASE_ID (and APPLE_SIGN_IN = true once Apple is set up)
# Until D1_DATABASE_ID is set this workflow is skipped and the GitHub Pages
# workflow keeps publishing the local-only test site instead.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      # The site is served from the root of the Worker's address, and the app
      # talks to /api on that same address.
      - run: >-
          flutter build web --release
          --base-href /
          --dart-define=API_URL=same-origin
          --dart-define=APPLE_SIGN_IN=${{ vars.APPLE_SIGN_IN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Point wrangler.toml at the D1 database
        working-directory: backend
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ vars.D1_DATABASE_ID }}/" wrangler.toml
      - name: Update the database tables
        working-directory: backend
        run: npx wrangler d1 migrations apply setlist-tracker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker and the website
        working-directory: backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
